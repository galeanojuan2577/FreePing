[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freeping"
version = "0.1.0"
description = "FreePing - Tu NoPing personal, gratuito y autoalojado"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Diego Galeano"}]

dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-qt>=4.4",
    "pytest-mock>=3.12",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
build = ["pyinstaller>=6.0"]

[project.scripts]
freeping = "freeping.__main__:main"
freeping-gui = "freeping.gui.app:launch_gui"

[tool.setuptools.packages.find]
include = ["freeping*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that are slow",
    "integration: tests that hit real APIs",
    "gui: tests that require Qt",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["freeping"]
omit = ["freeping/gui/resources/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_unimported = false
